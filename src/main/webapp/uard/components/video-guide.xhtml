<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets">
    <section class="uard-video-guides__item" id="#{videoSlug}" aria-labelledby="#{videoSlug}-title">
        <div class="uard-video-guides__description">
            <span class="uard-video-guides__number" aria-hidden="true">#{videoNumber}</span>
            <h2 id="#{videoSlug}-title">#{videoTitle}</h2>
            <p>#{videoDescription}</p>
            <p class="uard-video-guides__meta"><time datetime="#{videoDurationIso}">#{videoDuration}</time> · #{bundle['org.videoGuides.audioLanguage']}</p>
            <a class="uard-video-guides__open" href="#{request.contextPath}/resources/videos/uard/#{videoSlug}#{dataverseSession.localeCode eq 'en' ? '-en' : ''}.mp4">#{bundle['org.videoGuides.openVideo']}</a>
        </div>
        <video class="uard-video-guides__player" controls="controls" preload="none" playsinline="playsinline"
               width="1056" height="594" lang="#{dataverseSession.localeCode eq 'en' ? 'en' : 'uk'}" aria-labelledby="#{videoSlug}-title"
               poster="#{request.contextPath}/resources/videos/uard/#{videoSlug}.jpg">
            <source src="#{request.contextPath}/resources/videos/uard/#{videoSlug}#{dataverseSession.localeCode eq 'en' ? '-en' : ''}.mp4" type="video/mp4" />
            <p>#{bundle['org.videoGuides.unsupported']}
                <a href="#{request.contextPath}/resources/videos/uard/#{videoSlug}#{dataverseSession.localeCode eq 'en' ? '-en' : ''}.mp4">#{bundle['org.videoGuides.openVideo']}</a>
            </p>
        </video>
    </section>
</ui:composition>
