<!-- Generated by scripts/customization/build-footer.py. Edit customization/footer sources. -->
<div class="uard-footer" id="uard-footer" lang="uk">
    <div class="uard-footer__inner">
        <div class="uard-footer__brand">
            <a href="/" class="uard-footer__home"><img src="{{logo}}" width="64" height="64" alt="UaRD"><span class="uard-footer__home-label" data-footer-text="home">{{home}}</span></a>
            <p data-footer-text="tagline">{{tagline}}</p>
        </div>
        <section class="uard-footer__column" aria-labelledby="uard-footer-repository">
            <h2 id="uard-footer-repository" data-footer-text="repository">{{repository}}</h2>
            <ul>{{repositoryItems}}</ul>
        </section>
        <section class="uard-footer__column" aria-labelledby="uard-footer-support">
            <h2 id="uard-footer-support" data-footer-text="support">{{support}}</h2>
            <ul><li><button class="uard-footer__support" type="button" hidden data-footer-text="contactSupport">{{contactSupport}}</button></li>{{supportItems}}</ul>
        </section>
        <section class="uard-footer__column" aria-labelledby="uard-footer-ecosystem">
            <h2 id="uard-footer-ecosystem" data-footer-text="ecosystem">{{ecosystem}}</h2>
            <ul>{{ecosystemItems}}</ul>
        </section>
        <section class="uard-footer__column" aria-labelledby="uard-footer-operator">
            <h2 id="uard-footer-operator" data-footer-text="operator">{{operator}}</h2>
            <ul>{{operatorItems}}</ul>
        </section>
    </div>
    <script type="application/json" id="uard-footer-translations">{{translations}}</script>
    <script src="{{scriptUrl}}" defer></script>
</div>
